<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>W3HUB SCRIPT</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#f4f4f4;background:#080b0f}
body{
  overflow-x:hidden;
  background:
   radial-gradient(circle at 50% 31%,rgba(150,74,12,.18),transparent 27%),
   radial-gradient(circle at 50% 48%,rgba(74,38,10,.11),transparent 42%),
   #080b0f;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;
 background:linear-gradient(115deg,transparent 35%,rgba(255,155,40,.025) 50%,transparent 65%);
 animation:shine 5s linear infinite;
}
@keyframes shine{0%{transform:translateX(-35%)}100%{transform:translateX(35%)}}
.wrap{width:100%;max-width:390px;margin:auto;padding:82px 17px 45px}
.brand{text-align:center;margin-bottom:29px}
.logo{
 width:70px;height:70px;margin:0 auto 11px;border-radius:19px;
 display:grid;place-items:center;font-size:36px;
 border:1px solid #9a590b;background:rgba(46,29,10,.48);
 box-shadow:0 0 7px rgba(255,151,28,.55),0 0 24px rgba(255,151,28,.2),inset 0 0 17px rgba(255,151,28,.08);
 animation:pulse 2.3s ease-in-out infinite;
}
@keyframes pulse{50%{box-shadow:0 0 12px rgba(255,151,28,.8),0 0 30px rgba(255,151,28,.27),inset 0 0 17px rgba(255,151,28,.12)}}
.brand h1{font-size:25px;margin:0;font-weight:800}
.brand p{font-size:13px;letter-spacing:2.2px;color:#aaa;margin:7px 0 0}
.card{
 border:1px solid #696a63;border-radius:25px;padding:24px 17px 26px;
 background:rgba(15,18,24,.96);
 box-shadow:0 0 22px rgba(0,0,0,.35);
}
.badge{
 display:inline-flex;padding:7px 14px;border:1px solid #8b550c;border-radius:22px;
 color:#ffa83c;background:rgba(75,43,10,.2);font-size:14px;font-weight:700;
 box-shadow:0 0 10px rgba(255,150,30,.12)
}
h2{font-size:27px;margin:20px 0 24px}
.success{
 height:58px;display:flex;align-items:center;gap:12px;padding:0 15px;
 border:1px solid #08754d;border-radius:16px;background:rgba(12,62,45,.25);
 color:#20e77f;font-size:16px;margin-bottom:25px;
 box-shadow:0 0 15px rgba(20,222,123,.08);
}
.check{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:#2ddd81;color:white;font-weight:900}
.scriptbox{
 border:1px solid #747267;border-radius:21px;padding:17px 14px 20px;margin-bottom:26px;
 box-shadow:inset 0 0 14px rgba(255,157,40,.025)
}
.script-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#ffa83c;font-weight:700;font-size:15px;margin-bottom:18px}
.speed{font-size:12px;color:#b9b9bd;background:#202433;padding:8px 10px;border-radius:9px;white-space:nowrap}
pre{
 margin:0;border:1px solid #777469;border-radius:13px;background:#050607;padding:15px;
 color:#d68b39;font:12px/1.9 "Courier New",monospace;white-space:pre-wrap;word-break:break-all;
 box-shadow:inset 0 0 13px rgba(0,0,0,.5)
}
button{
 width:100%;height:60px;border-radius:17px;font-size:17px;font-weight:700;cursor:pointer;
 transition:.18s;position:relative;overflow:hidden
}
button:after{
 content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
 transform:skewX(-20deg);animation:buttonshine 3.5s infinite;
}
@keyframes buttonshine{0%,65%{left:-80%}100%{left:150%}}
.copy{
 border:1px solid #86510b;color:#ffa83c;
 background:linear-gradient(90deg,rgba(70,40,11,.7),rgba(39,25,10,.7));
 box-shadow:0 0 14px rgba(255,147,24,.12);
}
.new{margin-top:17px;border:1px solid #6f706b;background:#151820;color:#bdbdc0}
button:active{transform:scale(.98)}
footer{text-align:center;color:#999;font-size:12px;margin-top:26px}
.toast{
 position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;
 background:#14221c;border:1px solid #25865c;color:#35e98a;border-radius:11px;
 padding:10px 15px;font-size:13px;transition:.2s;pointer-events:none
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="wrap">
 <header class="brand">
  <div class="logo">🛡️</div>
  <h1>W3HUB</h1>
  <p>W3HUB SCRIPT</p>
 </header>

 <section class="card">
  <div class="badge">✓ THÀNH CÔNG</div>
  <h2>Script của bạn!</h2>

  <div class="success"><span class="check">✓</span><span>Script đã được tạo thành công!</span></div>

  <div class="scriptbox">
   <div class="script-head">
    <span>📜 W3HUB SCRIPT</span>
    <span class="speed">+1 Speed Keyboard Escape</span>
   </div>
   <pre id="script">loadstring(game:HttpGet("https://raw.githubusercontent.com/W3HUB/SCRIPT/main/W3HUB.lua"))()</pre>
  </div>

  <button class="copy" onclick="copyScript()">📋 &nbsp;Sao chép Script</button>
  <button class="new" onclick="newScript()">↩️ &nbsp;Lấy script mới</button>
 </section>

 <footer>W3HUB Auth • System 2026</footer>
</main>

<div id="toast" class="toast">Đã sao chép Script!</div>
<script>
function toast(){
 const t=document.getElementById('toast');t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),1400)
}
function copyScript(){
 const text=document.getElementById('script').innerText;
 if(navigator.clipboard) navigator.clipboard.writeText(text).then(toast);
 else{let a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast()}
}
function newScript(){
 document.getElementById('script').textContent='loadstring(game:HttpGet("https://raw.githubusercontent.com/W3HUB/SCRIPT/main/W3HUB.lua"))()';
 toast()
}
</script>
</body>
</html>
